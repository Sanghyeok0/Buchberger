name: Build paper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: manuscript.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Prepare arXiv source
        working-directory: paper
        run: |
          rm -rf arxiv-source
          mkdir -p arxiv-source/sections
          cp manuscript.tex references.bib lstlean.tex manuscript.bbl arxiv-source/
          cp sections/*.tex arxiv-source/sections/
          (cd arxiv-source && zip -r ../arxiv-source.zip .)

      - name: Update tracked review PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/manuscript.pdf
          if git diff --cached --quiet; then
            echo "Tracked PDF is already current."
          else
            git commit -m "Update manuscript PDF"
            git push
          fi

      - name: Upload paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-build
          path: |
            paper/manuscript.pdf
            paper/manuscript.bbl
            paper/arxiv-source.zip
          if-no-files-found: error
